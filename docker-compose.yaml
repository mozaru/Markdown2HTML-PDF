# Stack de produção — https://md2pdf.11tech.com.br
# A imagem é gerada no GitHub Actions e publicada no GHCR.
# Na VPS, o deploy baixa a tag do commit e a marca localmente como `deploy`;
# o compose nunca acessa o registry (pull_policy: never), então
# `docker compose up -d` recria o container com a imagem do último deploy.
# HTTPS: Cloudflare (proxy) -> Traefik da VPS (/server/traefik), pelas labels do `server`.

services:
  server:
    image: ${GHCR_IMAGE:-ghcr.io/mozaru/markdown2html-pdf}:deploy
    pull_policy: never
    container_name: md2pdf
    restart: unless-stopped
    networks:
      - proxy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.md2pdf.rule=Host(`md2pdf.11tech.com.br`)"
      - "traefik.http.routers.md2pdf.entrypoints=websecure"
      - "traefik.http.routers.md2pdf.tls=true"
      - "traefik.http.services.md2pdf.loadbalancer.server.port=8080"
      # CORS liberado (era feito no Nginx antigo): o md2pdf é usado por outras páginas.
      - "traefik.http.routers.md2pdf.middlewares=md2pdf-cors"
      - "traefik.http.middlewares.md2pdf-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.md2pdf-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.md2pdf-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,X-Requested-With"
      - "traefik.http.middlewares.md2pdf-cors.headers.addvaryheader=true"

networks:
  proxy:
    external: true
    name: proxy   # rede do Traefik (/server/traefik)
